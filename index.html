<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Exploration Quiz</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1d2233;
    --muted: #667085;
    --border: #e3e7f0;
    --accent: #6c5ce7;
    --accent-2: #00b4d8;
    --good: #22c55e;
    --good-bg: #e8f9ee;
    --bad: #ef4444;
    --bad-bg: #fdecec;
    --good-text: #15803d;
    --focus: #5b4bd6;
    --shadow: 0 10px 30px rgba(30, 40, 90, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e1a;
      --card: #151a2c;
      --text: #e7eaf6;
      --muted: #98a2b3;
      --border: #262d45;
      --accent: #8b7bff;
      --accent-2: #38bdf8;
      --good-bg: #123323;
      --bad-bg: #3a1618;
      --good-text: #4ade80;
      --focus: #a99dff;
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(108,92,231,.12), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(0,180,216,.12), transparent 40%),
      var(--bg);
  }
  .app { width: 100%; max-width: 440px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  header { text-align: center; margin-bottom: 18px; }
  header h1.mc {
    --mc-fg: #0b6b3a;
    --mc-glow: rgba(34, 197, 94, .25);
    --mc-panel: #eef7f1;
    --mc-line: #b7dcc4;
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 0 0 8px;
    padding: 10px 16px;
    font: 700 15px/1.3 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--mc-fg);
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.035) 2px 3px),
      var(--mc-panel);
    border: 1px solid var(--mc-line);
    border-radius: 10px;
    box-shadow: inset 0 0 18px var(--mc-glow);
    text-shadow: 0 0 6px var(--mc-glow);
  }
  @media (prefers-color-scheme: dark) {
    header h1.mc {
      --mc-fg: #4ade80;
      --mc-glow: rgba(74, 222, 128, .35);
      --mc-panel: #07140d;
      --mc-line: #1f4d32;
      background:
        repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.03) 2px 3px),
        var(--mc-panel);
    }
  }
  h1.mc::before, h1.mc::after {
    content: ""; position: absolute; width: 10px; height: 10px;
    border: 2px solid var(--mc-fg); opacity: .7;
  }
  h1.mc::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; border-top-left-radius: 4px; }
  h1.mc::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; border-bottom-right-radius: 4px; }
  .mc-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: .12em;
    padding: 2px 7px; border: 1px solid var(--mc-line); border-radius: 99px;
  }
  .mc-status i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--mc-fg); box-shadow: 0 0 6px var(--mc-fg);
    animation: blink 1.6s ease-in-out infinite;
  }
  .mc-cursor { display: inline-block; width: .55em; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--mc-fg); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .score { font-weight: 600; color: var(--text); }
  .score b { color: var(--accent); display: inline-block; }
  .score b.bump { animation: bump .4s ease; }
  .progress { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .progress > div {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: inherit;
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }

  .question { font-size: 16px; font-weight: 600; margin: 0 0 16px; }
  .options { display: grid; gap: 10px; }
  .option {
    font: inherit; color: inherit; text-align: left;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
  .option:focus-visible, .kbd-nav .option:focus {
    outline: 3px solid var(--focus); outline-offset: 3px;
    border-color: var(--focus);
  }
  .option:focus-visible .key, .kbd-nav .option:focus .key { background: var(--focus); color: #fff; }
  .question:focus { outline: none; }
  .option:disabled { cursor: default; }
  .option .key {
    flex: none; width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
    background: var(--border); color: var(--muted);
    transition: background .15s, color .15s;
  }
  .option.correct { border-color: var(--good); background: var(--good-bg); animation: pop .35s ease; }
  .option.correct .key { background: var(--good); color: #fff; }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .45s ease; }
  .option.wrong .key { background: var(--bad); color: #fff; }
  .option.dim { opacity: .55; }

  .feedback {
    min-height: 44px; margin-top: 16px; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
    opacity: 0; transform: translateY(6px);
    transition: opacity .25s, transform .25s;
  }
  .feedback.show { opacity: 1; transform: none; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .feedback span.fact { color: var(--muted); }

  .btn {
    font: inherit; font-weight: 600;
    width: 100%; margin-top: 8px;
    padding: 12px; border: 0; border-radius: 12px;
    color: #fff; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: transform .1s, opacity .2s, filter .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .4; cursor: default; filter: none; }
  .btn:focus-visible, .kbd-nav .btn:focus { outline: 3px solid var(--focus); outline-offset: 3px; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  kbd {
    font: 600 12px ui-monospace, Consolas, monospace;
    padding: 1px 6px; border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 5px; background: var(--card); color: var(--text);
  }

  .card { transition: box-shadow .4s; }
  .card.celebrate {
    border: 2px solid transparent;
    background:
      linear-gradient(var(--card), var(--card)) padding-box,
      linear-gradient(120deg, var(--accent), var(--accent-2), var(--good), #facc15, var(--accent)) border-box;
    background-size: 100% 100%, 300% 300%;
    animation: borderFlow 6s linear infinite, glow 2.6s ease-in-out infinite;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font: 700 12px/1 ui-monospace, Consolas, monospace;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 99px; margin-bottom: 14px;
    color: var(--good-text); background: var(--good-bg);
    animation: popIn .5s cubic-bezier(.2,1.6,.4,1) .2s backwards;
  }
  .emoji-wrap { position: relative; display: inline-block; }
  .spark {
    position: absolute; font-size: 20px; line-height: 1;
    animation: sparkle 1.8s ease-in-out infinite;
  }
  .spark.s1 { top: -6px; left: -22px; }
  .spark.s2 { top: 4px; right: -26px; animation-delay: .6s; }
  .spark.s3 { bottom: -4px; left: -14px; animation-delay: 1.2s; font-size: 16px; }

  .fade-in { animation: fadeIn .35s ease; }

  .results { text-align: center; }
  .results .emoji { font-size: 72px; line-height: 1; display: inline-block; animation: float 2.4s ease-in-out infinite, popIn .6s cubic-bezier(.2,1.6,.4,1); }
  .results h2 { font-size: 20px; margin: 14px 0 4px; }
  .results .big { font-size: 36px; font-weight: 800; margin: 8px 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .results p { color: var(--muted); margin: 0 0 16px; }
  .result-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .result-actions .btn { min-width: 0; margin-top: 8px; }
  .copy-result-status { margin: 10px 0 0 !important; }
  .copy-fallback {
    width: 100%; margin-top: 8px; padding: 10px;
    color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; font: inherit; text-align: left; resize: vertical;
  }
  .copy-fallback[hidden] { display: none; }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 0 0 18px; flex-wrap: wrap; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; display: block; animation: popIn .4s backwards; }
  .dots i.g { background: var(--good); }
  .dots i.r { background: var(--bad); }
  .review-toggle { margin: 0 0 12px; }
  .review-panel { position: relative; z-index: 1; display: grid; gap: 10px; margin-bottom: 16px; text-align: left; }
  .review-panel[hidden] { display: none; }
  .review-item {
    min-width: 0; padding: 12px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--bg); overflow-wrap: anywhere;
  }
  .review-item h3 { font-size: 15px; line-height: 1.4; margin: 0 0 8px; }
  .review-item p { margin: 5px 0 0; }
  .review-item strong { color: var(--text); }
  .review-item .review-fact { color: var(--muted); }
  .results p.all-correct { margin-bottom: 12px; }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
  .confetti { position: fixed; top: -12px; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; animation: fall linear forwards; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
  @keyframes bump { 50% { transform: scale(1.4); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes borderFlow { to { background-position: 0 0, 300% 0; } }
  @keyframes glow {
    50% { box-shadow: var(--shadow), 0 0 32px rgba(108, 92, 231, .35); }
  }
  @keyframes sparkle {
    0%, 100% { transform: scale(.6) rotate(0); opacity: .3; }
    50% { transform: scale(1.15) rotate(20deg); opacity: 1; }
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .8; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas class="stars" id="stars" aria-hidden="true"></canvas>
<main class="app">
  <header>
    <h1 class="mc">
      <span class="mc-status" aria-hidden="true"><i></i>Live</span>
      <span>Space Exploration Quiz</span><span class="mc-cursor" aria-hidden="true"></span>
    </h1>
    <p>10 questions about our journey to the stars</p>
  </header>
  <section class="card" id="card" aria-live="polite"></section>
  <p class="hint"><kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> to answer · <kbd>↑</kbd><kbd>↓</kbd> to move · <kbd>Enter</kbd> for next</p>
</main>

<script>
const QUESTIONS = [
  { q: "Who was the first human to travel into space?", a: ["Neil Armstrong", "Yuri Gagarin", "Alan Shepard", "John Glenn"], c: 1, f: "Gagarin orbited Earth aboard Vostok 1 on April 12, 1961." },
  { q: "Which mission first landed humans on the Moon?", a: ["Apollo 8", "Apollo 11", "Apollo 13", "Gemini 4"], c: 1, f: "Apollo 11 landed on July 20, 1969." },
  { q: "What was the first artificial satellite?", a: ["Explorer 1", "Vanguard 1", "Sputnik 1", "Telstar"], c: 2, f: "The USSR launched Sputnik 1 in October 1957." },
  { q: "Which planet is known as the Red Planet?", a: ["Venus", "Jupiter", "Mercury", "Mars"], c: 3, f: "Iron oxide (rust) in its soil gives Mars its red hue." },
  { q: "Which spacecraft was the first to leave the heliosphere?", a: ["Voyager 1", "Pioneer 10", "New Horizons", "Cassini"], c: 0, f: "Voyager 1 entered interstellar space in 2012." },
  { q: "What is the name of NASA's Mars helicopter?", a: ["Spirit", "Ingenuity", "Curiosity", "Sojourner"], c: 1, f: "Ingenuity made the first powered flight on another planet in 2021." },
  { q: "Which telescope launched in 2021 observes mainly in infrared?", a: ["Hubble", "Spitzer", "James Webb", "Kepler"], c: 2, f: "JWST orbits near the Sun–Earth L2 point." },
  { q: "Who was the first woman in space?", a: ["Sally Ride", "Valentina Tereshkova", "Mae Jemison", "Svetlana Savitskaya"], c: 1, f: "Tereshkova flew Vostok 6 in 1963." },
  { q: "Roughly how fast does the ISS travel?", a: ["2,800 km/h", "11,000 km/h", "28,000 km/h", "56,000 km/h"], c: 2, f: "It circles Earth about every 90 minutes." },
  { q: "Which is the largest planet in our solar system?", a: ["Saturn", "Neptune", "Earth", "Jupiter"], c: 3, f: "Over 1,300 Earths could fit inside Jupiter." }
];

const card = document.getElementById("card");
function shuffledQuestions() {
  const questions = [...QUESTIONS];
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  return questions;
}

let attemptQuestions = shuffledQuestions();
let idx = 0, score = 0, answered = false, history = [];

function renderQuestion(moveFocus = false) {
  const item = attemptQuestions[idx];
  answered = false;
  card.classList.remove("celebrate");
  card.innerHTML = `
    <div class="fade-in">
      <div class="meta">
        <span>Question ${idx + 1} of ${QUESTIONS.length}</span>
        <span class="score">Score: <b id="score">${score}</b></span>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${QUESTIONS.length}" aria-valuenow="${idx}">
        <div id="bar"></div>
      </div>
      <p class="question" id="question" tabindex="-1">${item.q}</p>
      <div class="options" role="group" aria-labelledby="question">
        ${item.a.map((t, i) => `<button class="option" data-i="${i}"><span class="key">${"ABCD"[i]}</span><span>${t}</span></button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="btn" id="next" disabled>${idx === QUESTIONS.length - 1 ? "See results" : "Next question"}</button>
    </div>`;
  const bar = document.getElementById("bar");
  bar.style.width = (idx / QUESTIONS.length * 100) + "%";
  card.querySelectorAll(".option").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
  document.getElementById("next").addEventListener("click", next);
  if (moveFocus) document.getElementById("question").focus({ preventScroll: true });
}

function choose(i) {
  if (answered) return;
  answered = true;
  const item = attemptQuestions[idx];
  const opts = [...card.querySelectorAll(".option")];
  const correct = i === item.c;
  history.push({ selectedIndex: i, correct });
  opts.forEach((b, j) => {
    b.disabled = true;
    if (j === item.c) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("feedback");
  if (correct) {
    score++;
    const s = document.getElementById("score");
    s.textContent = score;
    s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump");
    fb.className = "feedback good";
    fb.innerHTML = `✅ <div><strong>Correct!</strong> <span class="fact">${item.f}</span></div>`;
  } else {
    fb.className = "feedback bad";
    fb.innerHTML = `❌ <div><strong>Not quite.</strong> <span class="fact">${item.f}</span></div>`;
  }
  requestAnimationFrame(() => fb.classList.add("show"));
  document.getElementById("bar").style.width = ((idx + 1) / QUESTIONS.length * 100) + "%";
  const nextBtn = document.getElementById("next");
  nextBtn.disabled = false;
  nextBtn.focus({ preventScroll: true });
}

function next() {
  idx++;
  idx < QUESTIONS.length ? renderQuestion(true) : renderResults();
}

function formatResult(score, total, title) {
  return `Space Exploration Quiz\nScore: ${score} / ${total}\nResult: ${title}`;
}

async function copyResult(summary, status, fallback) {
  try {
    if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
      throw new Error("Clipboard access is unavailable.");
    }
    await navigator.clipboard.writeText(summary);
    status.textContent = "Result copied to clipboard.";
    fallback.hidden = true;
  } catch {
    status.textContent = "Unable to copy automatically. Select and copy the result below.";
    fallback.value = summary;
    fallback.hidden = false;
    fallback.focus();
    fallback.select();
  }
}

function renderResults() {
  const pct = score / QUESTIONS.length;
  const [emoji, title, msg] =
    pct === 1   ? ["🤩", "Perfect launch!", "You're ready for mission control."] :
    pct >= .8   ? ["🚀", "Stellar work!", "You really know your space history."] :
    pct >= .5   ? ["🙂", "Solid orbit!", "A few more missions and you'll be a pro."] :
    pct >= .3   ? ["🤔", "Houston, we have a problem…", "Time to brush up on the cosmos."] :
                  ["😵", "Lost in space!", "Every astronaut starts somewhere — try again!"];
  const celebrate = pct >= .8;
  const resultSummary = formatResult(score, QUESTIONS.length, title);
  card.classList.toggle("celebrate", celebrate);
  const missed = history.some(answer => !answer.correct);
  card.innerHTML = `
    <div class="results fade-in">
      ${celebrate ? `<div class="badge">🏅 Mission accomplished</div><br>` : ""}
      <div class="emoji-wrap" aria-hidden="true">
        <div class="emoji">${emoji}</div>
        ${celebrate ? `<span class="spark s1">✨</span><span class="spark s2">⭐</span><span class="spark s3">✨</span>` : ""}
      </div>
      <h2>${title}</h2>
      <div class="big">${score} / ${QUESTIONS.length}</div>
      <p>${msg}</p>
      <div class="dots" role="img" aria-label="${score} of ${QUESTIONS.length} answers correct">${history.map((answer, i) => `<i class="${answer.correct ? "g" : "r"}" style="animation-delay:${i * 60}ms" title="Q${i + 1}: ${answer.correct ? "correct" : "wrong"}"></i>`).join("")}</div>
      ${missed ? `
        <button class="btn review-toggle" id="review-toggle" type="button" aria-expanded="false" aria-controls="missed-review">Review missed answers</button>
        <section class="review-panel" id="missed-review" aria-label="Missed answer review" hidden>
          ${history.map((answer, i) => {
            if (answer.correct) return "";
            const item = attemptQuestions[i];
            return `<article class="review-item">
              <h3>Question ${i + 1}: ${item.q}</h3>
              <p><strong>Your answer:</strong> ${item.a[answer.selectedIndex]}</p>
              <p><strong>Correct answer:</strong> ${item.a[item.c]}</p>
              <p class="review-fact">${item.f}</p>
            </article>`;
          }).join("")}
        </section>` : `<p class="all-correct">All answers correct — nothing to review.</p>`}
      <div class="result-actions">
        <button class="btn" id="copy-result" type="button">Copy result</button>
        <button class="btn" id="restart" type="button">Play again</button>
      </div>
      <p class="copy-result-status" id="copy-result-status" role="status" aria-live="polite"></p>
      <textarea class="copy-fallback" id="copy-result-fallback" aria-label="Quiz result to copy" readonly hidden></textarea>
    </div>`;
  const reviewToggle = document.getElementById("review-toggle");
  if (reviewToggle) {
    const review = document.getElementById("missed-review");
    reviewToggle.addEventListener("click", () => {
      const expanded = reviewToggle.getAttribute("aria-expanded") === "true";
      reviewToggle.setAttribute("aria-expanded", String(!expanded));
      reviewToggle.textContent = expanded ? "Review missed answers" : "Hide missed answers";
      review.hidden = expanded;
    });
  }
  document.getElementById("copy-result").addEventListener("click", () => {
    copyResult(resultSummary, document.getElementById("copy-result-status"), document.getElementById("copy-result-fallback"));
  });
  const restart = document.getElementById("restart");
  restart.addEventListener("click", () => {
    idx = 0; score = 0; history = []; attemptQuestions = shuffledQuestions(); renderQuestion(true);
  });
  restart.focus({ preventScroll: true });
  if (celebrate && !reduceMotion.matches) confetti();
}

function confetti() {
  const colors = ["#6c5ce7", "#00b4d8", "#22c55e", "#facc15", "#f472b6"];
  for (let i = 0; i < 120; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    if (i % 3 === 0) c.style.borderRadius = "50%";
    c.style.animationDuration = 2 + Math.random() * 2 + "s";
    c.style.animationDelay = Math.random() * 1.2 + "s";
    document.body.appendChild(c);
    c.addEventListener("animationend", () => c.remove());
  }
}

document.addEventListener("keydown", () => document.body.classList.add("kbd-nav"), true);
document.addEventListener("pointerdown", () => document.body.classList.remove("kbd-nav"), true);

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || idx >= QUESTIONS.length) return;
  const k = e.key.toUpperCase();
  const opts = [...card.querySelectorAll(".option")];
  if (!answered && k.length === 1 && "ABCD1234".includes(k)) {
    e.preventDefault();
    choose("ABCD".includes(k) ? "ABCD".indexOf(k) : +k - 1);
  } else if (!answered && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const cur = opts.indexOf(document.activeElement);
    const step = e.key === "ArrowDown" ? 1 : -1;
    const n = cur === -1 ? (step > 0 ? 0 : opts.length - 1) : (cur + step + opts.length) % opts.length;
    opts[n].focus();
  } else if (answered && e.key === "Enter" && !(e.target instanceof HTMLButtonElement)) {
    e.preventDefault();
    next();
  }
});

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

(function starfield() {
  const cv = document.getElementById("stars");
  const ctx = cv.getContext("2d");
  const dark = matchMedia("(prefers-color-scheme: dark)");
  let stars = [], w = 0, h = 0, raf = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + "px"; cv.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(w * h / 7000) }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.1 + .3,
      phase: Math.random() * Math.PI * 2,
      speed: .5 + Math.random() * 1.2,
      drift: .02 + Math.random() * .06
    }));
    start();
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    const rgb = dark.matches ? "255,255,255" : "80,90,160";
    const max = dark.matches ? .75 : .3;
    const still = reduceMotion.matches;
    for (const s of stars) {
      const tw = still ? .7 : .55 + .45 * Math.sin(s.phase + t / 1000 * s.speed);
      if (!still) { s.y -= s.drift; if (s.y < -2) { s.y = h + 2; s.x = Math.random() * w; } }
      ctx.fillStyle = `rgba(${rgb},${(max * tw).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop(t) { draw(t); raf = requestAnimationFrame(loop); }
  function start() {
    cancelAnimationFrame(raf);
    if (reduceMotion.matches) draw(0);
    else raf = requestAnimationFrame(loop);
  }

  addEventListener("resize", resize);
  reduceMotion.addEventListener("change", start);
  dark.addEventListener("change", start);
  resize();
})();

renderQuestion();
</script>
